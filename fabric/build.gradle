plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    runs {
        client {
            // HotSwap upgrades. -XX:+IgnoreUnrecognizedVMOptions keeps these harmless
            // on a stock JDK, where they are simply ignored.
            vmArgs(
                    '-XX:+IgnoreUnrecognizedVMOptions',
                    '-XX:+AllowEnhancedClassRedefinition',
                    '-XX:+AllowRedefinitionToAddDeleteMethods'
            )
            programArgs('--username', 'DevPlayer')

            // Boot straight into the dev world (see dev_world in gradle.properties).
            def devWorld = rootProject.findProperty('dev_world')?.toString()?.trim()
            if (devWorld && file("run/saves/${devWorld}").isDirectory()) {
                programArgs('--quickPlaySingleplayer', devWorld)
            }
        }
        server {
            vmArgs(
                    '-XX:+IgnoreUnrecognizedVMOptions',
                    '-XX:+AllowEnhancedClassRedefinition',
                    '-XX:+AllowRedefinitionToAddDeleteMethods'
            )
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        force("net.fabricmc:fabric-loader:$fabric_loader_version")
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'JamiesWhiteShirt'
        url = 'https://maven.jamieswhiteshirt.com/libs-release/'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven { url = "https://cursemaven.com" }
}

dependencies {
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    // Disabled for 1.21.11: 2.4.0 injects into a removed Container method and crashes at startup.
    // The old reach-based item hooks remain preserved in source while the vanilla attack-range port is pending.
    // modImplementation include("com.jamieswhiteshirt:reach-entity-attributes:2.4.0")
    modImplementation("software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}")
    modApi include("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
//    modCompileOnly "dev.emi:emi-fabric:${rootProject.emi_version}:api"
    modCompileOnly "maven.modrinth:jade:${rootProject.jade_fabric_version}"

    // ModMenu integration - Cloth Config will automatically provide the config screen
    modImplementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }

    // Optional JEI integration: API-only for production, full mod in local development.
    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}"
    modLocalRuntime "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"
}

processResources {
    exclude('META-INF/mods.toml')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property 'version', project.version
    inputs.property 'cloth_config_version', rootProject.cloth_config_version

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                minecraft_version: rootProject.minecraft_version,
                fabric_loader_version: rootProject.fabric_loader_version,
                fabric_api_version: rootProject.fabric_api_version,
                cloth_config_version: rootProject.cloth_config_version
        )
    }

    from(project(":common").file("src/main/resources/saintsdragons.accesswidener"))
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    archiveFileName.set("saintsdragons-${project.version}+fabric-${rootProject.minecraft_version}.jar")
    inputFile.set(shadowJar.archiveFile)
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def commonSources = project(":common").tasks.named("sourcesJar")
    dependsOn(commonSources)
    from(commonSources.flatMap { it.archiveFile }.map { zipTree(it) })
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        // ClientLevel exposes these methods directly in 1.21.11. Keep the old accessor source
        // for reference without shipping a mixin whose removed descriptor cannot be remapped.
        java.exclude 'com/leon/saintsdragons/fabric/mixin/ClientLevelEntityMapAccessor.java'
        // Preserve the old renderer hooks until their removed 1.20-era targets can be
        // reimplemented with the 1.21.11 render-state pipeline.
        java.exclude 'com/leon/saintsdragons/fabric/client/renderer/FabricDraconianArmorRenderer.java'
        java.exclude 'com/leon/saintsdragons/fabric/mixin/ClientRecipeBookMixin.java'
        java.exclude 'com/leon/saintsdragons/fabric/mixin/fabric/BloodTempestAfterimage*Mixin.java'
        java.exclude 'com/leon/saintsdragons/fabric/mixin/fabric/EntityRenderDispatcherMixin.java'
        java.exclude 'com/leon/saintsdragons/fabric/mixin/fabric/GameRendererMixin.java'
        java.exclude 'com/leon/saintsdragons/fabric/mixin/fabric/LivingEntityRendererMixin.java'
        java.exclude 'com/leon/saintsdragons/fabric/mixin/fabric/RiderMixin.java'
        resources.srcDirs = [
                'src/main/resources',
                '../common/src/main/resources',
                '../common/src/generated/resources'
        ]
    }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
