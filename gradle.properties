# --- dev iteration ---------------------------------------------------------
# Save folder the dev client boots straight into, skipping the main menu.
# Fabric looks in fabric/run/saves, Forge in run/saves. Leave empty to stop at
# the menu; a name that does not exist on disk is ignored instead of crashing.
dev_world=New World

# run* tasks use the JetBrains Runtime when Gradle can find one, so HotSwap can
# add and remove methods/fields instead of only swapping method bodies. If it is
# not auto-detected, point Gradle at your IDE's bundled JBR:
# org.gradle.java.installations.paths=C:\\Program Files\\JetBrains\\IntelliJ IDEA 2025.2\\jbr
# Set this to false to always use the plain Java 21 toolchain instead:
# use_jbr_for_runs=false
# ---------------------------------------------------------------------------
