plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5.169'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

architectury {
    minecraft = project.minecraft_version
}

publishMods {
    type = ALPHA

    def curseforgeCommon = curseforgeOptions {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = rootProject.curseforge_project_id
        minecraftVersions.add(rootProject.minecraft_version)
        clientRequired = true
        serverRequired = true
    }

    def modrinthCommon = modrinthOptions {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = rootProject.modrinth_project_id
        minecraftVersions.add(rootProject.minecraft_version)
    }

    curseforge('curseforgeFabric') {
        from curseforgeCommon
        file project(':fabric')
        modLoaders.add('fabric')
        requires('fabric-api', 'geckolib')
    }

    curseforge('curseforgeForge') {
        from curseforgeCommon
        file project(':forge')
        modLoaders.add('forge')
        requires('geckolib')
    }

    modrinth('modrinthFabric') {
        from modrinthCommon
        file project(':fabric')
        modLoaders.add('fabric')
        requires('fabric-api', 'geckolib')
    }

    modrinth('modrinthForge') {
        from modrinthCommon
        file project(':forge')
        modLoaders.add('forge')
        requires('geckolib')
    }
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.mod_id-$project.name"
    }

    repositories {
        mavenCentral()
        maven { url = uri('https://maven.minecraftforge.net/') }
        maven { url = uri('https://maven.fabricmc.net/') }
        maven { url = uri('https://libraries.minecraft.net/') }
        maven { url = uri('https://repo.spongepowered.org/repository/maven-public/') }
        maven {
            name = 'Architectury'
            url = uri('https://maven.architectury.dev/')
        }
        maven {
            name = 'GeckoLib'
            url = uri('https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/')
        }
        maven {
            name = "Progwml6's maven"
            url = uri('https://dvs1.progwml6.com/files/maven/')
        }
        maven {
            name = "Jared's maven"
            url = uri('https://maven.blamejared.com/')
        }
        maven {
            name = 'ModMaven'
            url = uri('https://modmaven.dev')
        }
        maven {
            name = 'TerraformersMC'
            url = uri('https://maven.terraformersmc.com/releases/')
        }
        maven {
            name = 'Shedaniel'
            url = uri('https://maven.shedaniel.me/')
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }

        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.encoding = 'UTF-8'
    }

    // Dev launches (runClient/runServer/runData) prefer the JetBrains Runtime so
    // HotSwap can add and remove methods and fields while the game is running.
    // Falls back to the plain Java 21 toolchain when no JBR is visible to Gradle;
    // see DEV-ITERATION.md.
    def useJbrForRuns = (rootProject.findProperty('use_jbr_for_runs') ?: 'true').toString().toBoolean()
    def jbrLauncher = null
    if (useJbrForRuns) {
        try {
            jbrLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(21)
                vendor = JvmVendorSpec.JETBRAINS
            }.getOrNull()
        } catch (Exception ignored) {
            jbrLauncher = null
        }
    }

    tasks.withType(JavaExec).configureEach { execTask ->
        if (jbrLauncher != null && execTask.name.startsWith('run')) {
            execTask.javaLauncher.set(jbrLauncher)
            execTask.doFirst {
                logger.lifecycle("[dev] launching on JetBrains Runtime: ${jbrLauncher.metadata.installationPath}")
            }
        } else {
            execTask.javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }

    tasks.named('processResources') {
        exclude('.cache/**')
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {

        }
    }
}
